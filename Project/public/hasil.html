<!DOCTYPE html>
<html>
<head>
    <title>Hasil SAW</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="content">

<h1>Ranking Karyawan</h1>

<table>

<thead>
<tr>
<th>Ranking</th>
<th>Nama</th>
<th>Nilai</th>
</tr>
</thead>

<tbody id="hasil"></tbody>

</table>

</div>

<script>

async function loadHasil(){

    const res = await fetch('/api/saw');

    const data = await res.json();

    const hasil = document.getElementById('hasil');

    hasil.innerHTML = '';

    data.forEach((item,index)=>{

        hasil.innerHTML += `
            <tr>
                <td>${index+1}</td>
                <td>${item.nama}</td>
                <td>${item.total}</td>
            </tr>
        `;
    })
}

loadHasil();

</script>

</body>
</html>
