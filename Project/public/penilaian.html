<!DOCTYPE html>
<html>
<head>
    <title>Penilaian</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="content">

<h1>Input Penilaian</h1>

<form id="formNilai">

    <input type="text" id="nama" placeholder="Nama Karyawan">

    <input type="number" id="nilai" placeholder="Nilai">

    <input type="number" step="0.01" id="bobot" placeholder="Bobot">

    <button type="submit">
        Simpan
    </button>

</form>

</div>

<script>

const form = document.getElementById('formNilai');

form.addEventListener('submit', async(e)=>{

    e.preventDefault();

    await fetch('/api/penilaian',{

        method:'POST',

        headers:{
            'Content-Type':'application/json'
        },

        body:JSON.stringify({
            nama:document.getElementById('nama').value,
            nilai:document.getElementById('nilai').value,
            bobot:document.getElementById('bobot').value
        })
    });

    alert('Penilaian berhasil disimpan');

})

</script>

</body>
</html>
